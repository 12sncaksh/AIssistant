# Aissistant · DSH 路由覆盖补丁（配置模板）
#
# 运行时文件：config/dsh_acp_overlay.yml（已被 .gitignore 忽略，不入库）
# 本文件只作字段说明与手写起点，程序不会读取它。
#
# 用途
#   ACP 桥接只使用 Aissistant 设置页中保存的独立 Provider，不读取 DSH Web 的 provider、URL 或 Key。
#   config/dsh_acp_overlay.yml 由程序自动生成；本模板只作字段说明，程序不会读取它。
#   API Key 不写入此文件，而是在启动 ACP 子进程时通过 apiKeyEnv 对应的环境变量注入。
#
# 格式
#   与 DSH 的 patch 文件一致：一个列表，每项用 id 指定目标模块，config 里写要覆盖的键值。
#
# 字段
#   id              : 目标模块 id，ACP 桥接固定为 acp。
#   config.provider : provider id（你在 DSH 里使用的模型提供方 / 网关名）。
#   config.model    : 该 provider 下的模型 id；省略或留空表示沿用 provider 的默认模型。
#
# 注意：推理档位（reasoning_effort）不在这个文件里。它由 DSH 在 ACP 会话里动态公布，
# 桥接改用 session/set_config_option 下发（见 README「DSH 桥接」）。只有当模型在
# DSH 的 settings.yaml 里声明了 reasoningEfforts，DSH 才会公布该选项。

- id: acp
  config:
    provider: your-provider-id
    model: your-model-id
